<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MINHLEIOS Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --pink:#ff3d9a;--pink-2:#ff7ac0;--cyan:#00e0ff;--cyan-2:#4be2ff;
  --purple:#a855f7;--green:#10f2a3;--red:#ff4d6d;
  --bg-0:#07010f;--bg-1:#12041f;--bg-2:#1c0731;
  --text:#fff;--text-dim:#b19cc9;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Quicksand',sans-serif;background:var(--bg-0);color:var(--text);position:relative;
  user-select:none;-webkit-user-select:none}

/* BACKGROUND */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,#2a0a4a 0%,transparent 60%),
             linear-gradient(180deg,var(--bg-0),var(--bg-1) 40%,var(--bg-2))}
.grid-overlay{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,61,154,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,224,255,.035) 1px,transparent 1px);
  background-size:36px 36px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 30%,transparent 75%);
  mask-image:radial-gradient(ellipse at 50% 50%,#000 30%,transparent 75%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform;
  animation:float 18s ease-in-out infinite}
.orb-pink{width:380px;height:380px;top:-100px;left:-80px;background:radial-gradient(circle,#ff3d9a,#c02a75)}
.orb-cyan{width:340px;height:340px;bottom:-100px;right:-80px;background:radial-gradient(circle,#00e0ff,#0082a8);animation-delay:-6s}
.orb-purple{width:280px;height:280px;top:38%;left:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,#a855f7,#5c1f9e);opacity:.4;animation-delay:-12s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,35px) scale(.94)}}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(12,3,24,.65);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  border-bottom:1px solid rgba(255,61,154,.18);box-shadow:0 4px 24px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:6px;font-family:'Baloo 2',sans-serif;
  font-weight:800;font-size:16px;letter-spacing:1px;
  background:linear-gradient(135deg,#ff7ac0,#ff3d9a,#a855f7);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  padding:4px 0;filter:drop-shadow(0 0 8px rgba(255,61,154,.4))}
.brand-icon{font-size:18px;filter:none;-webkit-text-fill-color:initial}
.brand-text{white-space:nowrap}

.stats-global{flex:1;display:flex;justify-content:center;gap:8px}
.stat{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.3px}
.stat i{font-size:11px}
.stat-win{background:rgba(16,242,163,.12);color:var(--green);border:1px solid rgba(16,242,163,.35)}
.stat-lose{background:rgba(255,77,109,.12);color:var(--red);border:1px solid rgba(255,77,109,.35)}
.stat-rate{background:rgba(0,224,255,.12);color:var(--cyan);border:1px solid rgba(0,224,255,.35)}

.icon-btn{width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,61,154,.4);
  background:linear-gradient(135deg,rgba(255,61,154,.18),rgba(168,85,247,.18));
  color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform .2s,box-shadow .2s,background .2s}
.icon-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,61,154,.45)}
.icon-btn:active{transform:scale(.94)}

/* CARD */
.card-wrap{position:fixed;z-index:50;touch-action:none;cursor:grab}
.card-wrap.dragging{cursor:grabbing}
.predict-card{position:relative;width:236px;padding:14px 14px 12px;border-radius:22px;
  background:linear-gradient(165deg,rgba(28,7,49,.92),rgba(20,4,40,.92));
  border:1.5px solid rgba(255,61,154,.28);
  box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.03) inset,0 1px 0 rgba(255,255,255,.06) inset;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  overflow:hidden;transition:transform .25s cubic-bezier(.4,1.4,.5,1),box-shadow .25s,border-color .25s}
#card-hu{border-color:rgba(0,224,255,.28)}
.predict-card::before{content:'';position:absolute;top:-60%;left:-60%;width:220%;height:220%;
  background:conic-gradient(from 0deg,transparent 0deg,transparent 300deg,rgba(255,61,154,.15) 330deg,rgba(255,61,154,.4) 360deg);
  animation:spin 8s linear infinite;pointer-events:none;z-index:0}
#card-hu::before{background:conic-gradient(from 0deg,transparent 0deg,transparent 300deg,rgba(0,224,255,.15) 330deg,rgba(0,224,255,.4) 360deg)}
@keyframes spin{to{transform:rotate(360deg)}}

.card-glow{position:absolute;width:120px;height:120px;border-radius:50%;filter:blur(50px);pointer-events:none;z-index:0}
.glow-pink{top:-40px;right:-40px;background:var(--pink);opacity:.4}
.glow-cyan{bottom:-40px;left:-40px;background:var(--cyan);opacity:.4}
.card-head,.card-body{position:relative;z-index:1}

.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-tag{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  background:rgba(255,61,154,.14);border:1px solid rgba(255,61,154,.4)}
#card-hu .card-tag{background:rgba(0,224,255,.14);border-color:rgba(0,224,255,.4)}
.tag-dot{width:6px;height:6px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink);
  animation:dotPulse 1.6s ease-in-out infinite}
#card-hu .tag-dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}
.tag-name{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:11px;letter-spacing:1.5px;color:#fff}

.card-mini-stats{flex:1;display:flex;gap:5px}
.mini-stat{padding:2px 7px;border-radius:6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:10.5px;letter-spacing:.3px}
.mini-stat.win{background:rgba(16,242,163,.15);color:var(--green)}
.mini-stat.lose{background:rgba(255,77,109,.15);color:var(--red)}

.toggle-btn{width:24px;height:24px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.05);color:var(--text-dim);font-size:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .2s,background .2s,color .2s}
.toggle-btn:hover{background:rgba(255,61,154,.2);color:#fff}
.toggle-btn i{transition:transform .3s}
.predict-card.collapsed .toggle-btn i{transform:rotate(180deg)}

.card-body{max-height:420px;opacity:1;overflow:hidden;
  transition:max-height .35s cubic-bezier(.4,1,.3,1),opacity .25s,margin .3s}
.predict-card.collapsed{padding-bottom:14px}
.predict-card.collapsed .card-body{max-height:0;opacity:0;margin:0}

.sid-row{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  font-size:11px;color:var(--text-dim);margin-bottom:10px;justify-content:center}
.sid-row i{font-size:9px;color:var(--pink)}
#card-hu .sid-row i{color:var(--cyan)}
.sid-row span{font-family:'Baloo 2',sans-serif;font-weight:800;letter-spacing:.5px;color:#fff;font-size:12px}

.result-row{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.res-circle{position:relative;width:82px;height:82px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);
  transition:transform .3s,box-shadow .3s,border-color .3s,background .3s}
.res-label{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:10px;letter-spacing:2px;opacity:.6}
.res-value{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;letter-spacing:.5px}
.res-circle.tai{color:#ff8fc0}
.res-circle.xiu{color:#7fdcff}
.res-circle.tai.active{color:#fff;background:linear-gradient(135deg,#ff3d9a,#c02a75);border-color:#ff8fc0;
  box-shadow:0 0 24px rgba(255,61,154,.7),0 0 0 3px rgba(255,61,154,.2);animation:pulseP .9s ease-in-out infinite}
.res-circle.xiu.active{color:#fff;background:linear-gradient(135deg,#00e0ff,#0082a8);border-color:#4be2ff;
  box-shadow:0 0 24px rgba(0,224,255,.7),0 0 0 3px rgba(0,224,255,.2);animation:pulseC .9s ease-in-out infinite}
@keyframes pulseP{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes pulseC{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.conf-wrap{display:none;margin-bottom:10px;padding:8px 10px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);text-align:center}
.conf-wrap.show{display:block;animation:slideIn .35s cubic-bezier(.4,1.4,.5,1)}
@keyframes slideIn{0%{transform:translateY(-6px);opacity:0}100%{transform:translateY(0);opacity:1}}
.conf-level{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:10.5px;letter-spacing:2px;margin-bottom:2px}
.conf-level.mid{color:#ffb347}
.conf-level.ok{color:#ff7ac0}
.conf-level.high{color:#ff3d9a}
.conf-num{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;letter-spacing:.5px;
  color:#fff;margin-bottom:5px;text-shadow:0 0 12px rgba(255,61,154,.5)}
.conf-bar{width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.conf-fill{height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#ffb347,#ff7ac0,#ff3d9a);
  transition:width .5s cubic-bezier(.4,1.4,.5,1);box-shadow:0 0 8px rgba(255,61,154,.7)}
.conf-fill.high{background:linear-gradient(90deg,#ff3d9a,#d63384,#a855f7)}

.status-row{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;
  font-size:10.5px;color:var(--text-dim);font-weight:600;letter-spacing:.4px}
.status-dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim);
  transition:background .3s,box-shadow .3s}
.status-row.analyzing .status-dot{background:var(--pink);box-shadow:0 0 8px var(--pink);animation:dotPulse 1s ease-in-out infinite}
.status-row.analyzing .status-text{color:var(--pink-2)}
#card-hu .status-row.analyzing .status-dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
#card-hu .status-row.analyzing .status-text{color:var(--cyan-2)}

.hist-label{font-size:9.5px;font-weight:700;letter-spacing:1.2px;color:var(--text-dim);
  text-align:center;margin-bottom:6px;text-transform:uppercase}
.hist-strip{display:flex;gap:4px;min-height:26px;padding:5px 6px;border-radius:10px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);overflow:hidden}
.hist-empty{width:100%;text-align:center;font-size:10px;color:var(--text-dim);opacity:.6;align-self:center}
.hist-item{flex:1;min-width:0;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-family:'Baloo 2',sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.3px;color:#fff;
  animation:popIn .35s cubic-bezier(.4,1.6,.5,1);border:1px solid transparent}
@keyframes popIn{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.hist-item.win{background:linear-gradient(135deg,rgba(16,242,163,.28),rgba(16,242,163,.12));
  border-color:rgba(16,242,163,.55);color:var(--green);box-shadow:0 0 8px rgba(16,242,163,.3)}
.hist-item.lose{background:linear-gradient(135deg,rgba(255,77,109,.28),rgba(255,77,109,.12));
  border-color:rgba(255,77,109,.55);color:var(--red)}
.hist-item.pending{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.15);color:var(--text-dim)}

.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120%);
  padding:10px 20px;border-radius:14px;background:rgba(20,5,35,.95);
  border:1px solid rgba(255,61,154,.5);color:#fff;font-weight:700;font-size:12.5px;letter-spacing:.3px;
  box-shadow:0 8px 32px rgba(255,61,154,.35);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  z-index:9999;opacity:0;pointer-events:none;
  transition:transform .35s cubic-bezier(.4,1.4,.5,1),opacity .3s;
  display:flex;align-items:center;gap:8px;max-width:90vw}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.win{border-color:rgba(16,242,163,.6);box-shadow:0 8px 32px rgba(16,242,163,.4)}
.toast.lose{border-color:rgba(255,77,109,.6);box-shadow:0 8px 32px rgba(255,77,109,.4)}

@media(max-width:520px){
  .predict-card{width:210px;padding:12px 12px 10px}
  .res-circle{width:70px;height:70px}
  .res-value{font-size:16px}
  .res-label{font-size:9px}
  .brand-text{font-size:14px}
  .stat{font-size:11.5px;padding:4px 9px}
  .icon-btn{width:32px;height:32px;font-size:13px}
}
</style>
</head>
<body>

<div class="bg">
  <div class="orb orb-pink"></div>
  <div class="orb orb-cyan"></div>
  <div class="orb orb-purple"></div>
  <div class="grid-overlay"></div>
</div>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon">🎀</span>
    <span class="brand-text">HK PRO</span>
  </div>
  <div class="stats-global">
    <div class="stat stat-win"><i class="fa-solid fa-circle-check"></i><span id="g-win">0</span></div>
    <div class="stat stat-lose"><i class="fa-solid fa-circle-xmark"></i><span id="g-lose">0</span></div>
    <div class="stat stat-rate"><i class="fa-solid fa-chart-line"></i><span id="g-rate">--%</span></div>
  </div>
  <button class="icon-btn" id="btnOpenSite" title="Mở trang chính">
    <i class="fa-solid fa-arrow-up-right-from-square"></i>
  </button>
</header>

<div class="card-wrap" id="wrap-md5" style="top:96px;left:16px">
  <div class="predict-card" id="card-md5">
    <div class="card-glow glow-pink"></div>
    <div class="card-head">
      <div class="card-tag"><span class="tag-dot"></span><span class="tag-name">MD5</span></div>
      <div class="card-mini-stats">
        <span class="mini-stat win" id="mini-win-md5">0</span>
        <span class="mini-stat lose" id="mini-lose-md5">0</span>
      </div>
      <button class="toggle-btn" data-card="card-md5"><i class="fa-solid fa-chevron-up"></i></button>
    </div>
    <div class="card-body">
      <div class="sid-row"><i class="fa-solid fa-hashtag"></i><span id="sid-md5">--</span></div>
      <div class="result-row">
        <div class="res-circle tai" id="tai-md5"><span class="res-label">TÀI</span><span class="res-value">--%</span></div>
        <div class="res-circle xiu" id="xiu-md5"><span class="res-label">XỈU</span><span class="res-value">--%</span></div>
      </div>
      <div class="conf-wrap" id="conf-md5">
        <div class="conf-level" id="conf-level-md5">--</div>
        <div class="conf-num" id="conf-num-md5">0%</div>
        <div class="conf-bar"><div class="conf-fill" id="conf-fill-md5"></div></div>
      </div>
      <div class="status-row" id="strow-md5">
        <span class="status-dot"></span><span class="status-text" id="status-md5">Đang kết nối...</span>
      </div>
      <div class="hist-label">Lịch sử 10 phiên gần nhất</div>
      <div class="hist-strip" id="hist-md5"><div class="hist-empty">Chưa có dữ liệu</div></div>
    </div>
  </div>
</div>

<div class="card-wrap" id="wrap-hu" style="top:96px;right:16px">
  <div class="predict-card" id="card-hu">
    <div class="card-glow glow-cyan"></div>
    <div class="card-head">
      <div class="card-tag"><span class="tag-dot"></span><span class="tag-name">HŨ</span></div>
      <div class="card-mini-stats">
        <span class="mini-stat win" id="mini-win-hu">0</span>
        <span class="mini-stat lose" id="mini-lose-hu">0</span>
      </div>
      <button class="toggle-btn" data-card="card-hu"><i class="fa-solid fa-chevron-up"></i></button>
    </div>
    <div class="card-body">
      <div class="sid-row"><i class="fa-solid fa-hashtag"></i><span id="sid-hu">--</span></div>
      <div class="result-row">
        <div class="res-circle tai" id="tai-hu"><span class="res-label">TÀI</span><span class="res-value">--%</span></div>
        <div class="res-circle xiu" id="xiu-hu"><span class="res-label">XỈU</span><span class="res-value">--%</span></div>
      </div>
      <div class="conf-wrap" id="conf-hu">
        <div class="conf-level" id="conf-level-hu">--</div>
        <div class="conf-num" id="conf-num-hu">0%</div>
        <div class="conf-bar"><div class="conf-fill" id="conf-fill-hu"></div></div>
      </div>
      <div class="status-row" id="strow-hu">
        <span class="status-dot"></span><span class="status-text" id="status-hu">Đang kết nối...</span>
      </div>
      <div class="hist-label">Lịch sử 10 phiên gần nhất</div>
      <div class="hist-strip" id="hist-hu"><div class="hist-empty">Chưa có dữ liệu</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
