<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title> MINH Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Background động -->
<div class="bg">
  <div class="orb orb-pink"></div>
  <div class="orb orb-cyan"></div>
  <div class="orb orb-purple"></div>
  <div class="grid-overlay"></div>
</div>

<!-- TOP BAR -->
<header class="topbar">
  <div class="brand">
    <span class="brand-icon">🎀</span>
    <span class="brand-text">LE MINH IOS</span>
  </div>

  <div class="stats-global">
    <div class="stat stat-win">
      <i class="fa-solid fa-circle-check"></i>
      <span id="g-win">0</span>
    </div>
    <div class="stat stat-lose">
      <i class="fa-solid fa-circle-xmark"></i>
      <span id="g-lose">0</span>
    </div>
    <div class="stat stat-rate">
      <i class="fa-solid fa-chart-line"></i>
      <span id="g-rate">--%</span>
    </div>
  </div>

  <button class="icon-btn" id="btnOpenSite" title="Mở trang chính">
    <i class="fa-solid fa-arrow-up-right-from-square"></i>
  </button>
</header>

<!-- CARD MD5 -->
<div class="card-wrap" id="wrap-md5" style="top:96px;left:16px">
  <div class="predict-card" id="card-md5">
    <div class="card-glow glow-pink"></div>
    <div class="card-head">
      <div class="card-tag">
        <span class="tag-dot"></span>
        <span class="tag-name">MD5</span>
      </div>
      <div class="card-mini-stats">
        <span class="mini-stat win" id="mini-win-md5">0</span>
        <span class="mini-stat lose" id="mini-lose-md5">0</span>
      </div>
      <button class="toggle-btn" data-card="card-md5">
        <i class="fa-solid fa-chevron-up"></i>
      </button>
    </div>

    <div class="card-body">
      <div class="sid-row">
        <i class="fa-solid fa-hashtag"></i>
        <span id="sid-md5">--</span>
      </div>

      <div class="result-row">
        <div class="res-circle tai" id="tai-md5">
          <span class="res-label">TÀI</span>
          <span class="res-value">--%</span>
        </div>
        <div class="res-circle xiu" id="xiu-md5">
          <span class="res-label">XỈU</span>
          <span class="res-value">--%</span>
        </div>
      </div>

      <div class="conf-wrap" id="conf-md5">
        <div class="conf-level" id="conf-level-md5">--</div>
        <div class="conf-num" id="conf-num-md5">0%</div>
        <div class="conf-bar"><div class="conf-fill" id="conf-fill-md5"></div></div>
      </div>

      <div class="status-row">
        <span class="status-dot"></span>
        <span class="status-text" id="status-md5">Đang kết nối...</span>
      </div>

      <div class="hist-label">Lịch sử 10 phiên gần nhất</div>
      <div class="hist-strip" id="hist-md5">
        <div class="hist-empty">Chưa có dữ liệu</div>
      </div>
    </div>
  </div>
</div>

<!-- CARD HŨ -->
<div class="card-wrap" id="wrap-hu" style="top:96px;right:16px">
  <div class="predict-card" id="card-hu">
    <div class="card-glow glow-cyan"></div>
    <div class="card-head">
      <div class="card-tag">
        <span class="tag-dot"></span>
        <span class="tag-name">HŨ</span>
      </div>
      <div class="card-mini-stats">
        <span class="mini-stat win" id="mini-win-hu">0</span>
        <span class="mini-stat lose" id="mini-lose-hu">0</span>
      </div>
      <button class="toggle-btn" data-card="card-hu">
        <i class="fa-solid fa-chevron-up"></i>
      </button>
    </div>

    <div class="card-body">
      <div class="sid-row">
        <i class="fa-solid fa-hashtag"></i>
        <span id="sid-hu">--</span>
      </div>

      <div class="result-row">
        <div class="res-circle tai" id="tai-hu">
          <span class="res-label">TÀI</span>
          <span class="res-value">--%</span>
        </div>
        <div class="res-circle xiu" id="xiu-hu">
          <span class="res-label">XỈU</span>
          <span class="res-value">--%</span>
        </div>
      </div>

      <div class="conf-wrap" id="conf-hu">
        <div class="conf-level" id="conf-level-hu">--</div>
        <div class="conf-num" id="conf-num-hu">0%</div>
        <div class="conf-bar"><div class="conf-fill" id="conf-fill-hu"></div></div>
      </div>

      <div class="status-row">
        <span class="status-dot"></span>
        <span class="status-text" id="status-hu">Đang kết nối...</span>
      </div>

      <div class="hist-label">Lịch sử 10 phiên gần nhất</div>
      <div class="hist-strip" id="hist-hu">
        <div class="hist-empty">Chưa có dữ liệu</div>
      </div>
    </div>
  </div>
</div>

<!-- Toast thông báo -->
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
